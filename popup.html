<!DOCTYPE html>
<html dir="ltr" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure Password Generator</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
<h2>🔐 Secure Password Generator</h2>

<div id="password" title="Click to copy" tabindex="0" role="button" aria-label="Generated password, click to copy">Password will appear here</div>

<div class="strength-row">
    <div class="strength-bar" aria-hidden="true">
        <div class="strength-fill" id="strength-fill"></div>
    </div>
    <span class="strength-label" id="strength-label"></span>
</div>

<div class="length-control">
    <div class="length-header">
        <label for="length" class="length-label">Password Length:</label>
        <input type="number" id="length" value="16" min="8" max="128">
    </div>
    <input type="range" id="length-slider" value="16" min="8" max="128" class="length-slider" aria-label="Password length slider">
</div>

<div class="options">
    <label><input type="checkbox" id="lower" checked> Lowercase Characters (a-z)</label>
    <label><input type="checkbox" id="upper" checked> Uppercase Characters (A-Z)</label>
    <label><input type="checkbox" id="numbers" checked> Numbers (0-9)</label>
    <label><input type="checkbox" id="symbols" checked> Symbols (!@#$...)</label>
    <label><input type="checkbox" id="exclude-similar"> Exclude Similar (o,0,i,l,1)</label>
    <label><input type="checkbox" id="exclude-ambiguous"> Exclude Ambiguous Characters</label>
</div>

<button id="generate"><span class="gen-icon">&#x21BB;</span> Generate New Password</button>

<div class="action-row">
    <button class="action-btn" id="btn-copy">&#x2398; Copy</button>
    <button class="action-btn" id="btn-history">&#x23F2; History</button>
    <button class="action-btn" id="btn-clear">&#x1F5D1; Clear</button>
</div>

<div class="history-panel" id="history-panel">
    <div class="history-header">
        <span>Recent Passwords</span>
        <div class="history-actions">
            <button class="history-clear-all" id="btn-clear-history" title="Clear all history">Clear All</button>
        </div>
    </div>
    <div class="history-list" id="history-list">
        <div class="history-empty" id="history-empty">No history yet</div>
    </div>
</div>

<div class="signature">
    Made with ❤️ by
    <a href="https://github.com/AbolfazlTafakori" target="_blank" rel="noopener noreferrer">ABOLFAZL</a>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="popup.js"></script>
</body>
</html>
